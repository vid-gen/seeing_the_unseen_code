# FORMAT
# hostname:
#     username:
#         training_data_dir: directory where you download your training hdf5 files
#              |___ Dominoes
#                      |__ pilot_ooo_xxx.hdf5
#                      |__ pilot_ooo_xxx.hdf5
#                      |__ pilot_ooo_xxx.hdf5
#                      |__ pilot_ooo_xxx.hdf5
#                      |__ ...
#              |___ Collide
#              |___ Drop
#              |___ ...
#         testing_data_dir: directory where you download your training hdf5 files
#              |___ Dominoes
#                      |__ pilot_ooo_xxx.hdf5
#                      |__ pilot_ooo_xxx.hdf5
#                      |__ pilot_ooo_xxx.hdf5
#                      |__ pilot_ooo_xxx.hdf5
#                      |__ ...
#              |___ Collide
#              |___ Drop
#              |___ ...
#         dpi_data_dir: directory where you plan to store the preprocessed data for DPI
#         out_dir: directory for dumping model, log, and visualization

# The hostname / username keys are regular expressions matched against
# socket.gethostname() and getpass.getuser(); ".*" matches any machine / user.
# Edit the four paths below before running pipeline_preprocess.sh.
".*":
    ".*":
        training_data_dir: '../data/physion_raw/dynamics_training'
        testing_data_dir: '../data/physion_raw/testing'
        dpi_data_dir: '../data/preprocessed'
        out_dir: '../output'
